    <script>
        const SECURE_GATEWAY = "https://useas-admin-gatekeeper.revanthreddy5292m.workers.dev";
        if (window.location.hostname !== new URL(SECURE_GATEWAY).hostname && !window.location.hostname.includes("localhost") && !window.location.hostname.startsWith("admin.")) {
            window.location.replace(SECURE_GATEWAY + (window.location.pathname.includes("/admcore") ? "/admcore/admin-login.html" : "/admin-login.html"));

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDEMuw60DEiC1WDRdQ5vslBKS8LimB_Uj0",
            authDomain: "studyhub-33164.firebaseapp.com",
            databaseURL: "https://studyhub-33164-default-rtdb.firebaseio.com",
            projectId: "studyhub-33164",
            storageBucket: "studyhub-33164.firebasestorage.app",
            messagingSenderId: "918352715015",
            appId: "1:918352715015:web:f92d94cb0ac679d432b9a2",
            measurementId: "G-7TJF6K184N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const lettersRef = ref(db, 'letters');

        // Handle Add Letter Submission
        window.saveLetter = function(e) {
            e.preventDefault();
            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const keywords = document.getElementById('keywords').value.trim();
            const format = document.getElementById('format').value.trim();

            if(!title || !format) return alert('Title and Content format are mandatory fields.');

            push(lettersRef, { title, category, keywords, format })
            .then(() => {
                document.getElementById('letterForm').reset();
                alert('Letter added successfully inside Database!');
            })
            .catch(err => alert('Error saving data: ' + err.message));
        };

        // Live monitor database items to allow targeted deletions
        onValue(lettersRef, (snapshot) => {
            const list = document.getElementById('activeList');
            list.innerHTML = '';
            const data = snapshot.val();
            if(!data) {
                list.innerHTML = `<p style="color: #64748b;">No active database templates detected.</p>`;
                return;
            }

            Object.keys(data).forEach(id => {
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerHTML = `
                    <div>
                        <strong>${data[id].title}</strong> <small style="color: #6366f1;">(${data[id].category})</small>
                    </div>
                    <button class="delete-btn" onclick="deleteLetter('${id}')"><i data-lucide="trash-2" style="width:16px;"></i></button>
                `;
                list.appendChild(div);
            });
            lucide.createIcons();
        });

        window.deleteLetter = function(id) {
            if(confirm('Are you absolutely sure you want to delete this template permanently?')) {
                remove(ref(db, 'letters/' + id));
            }
        };
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; margin: 0; padding: 0 0 40px 0; display: flex; flex-direction: column; align-items: center; }
        .admin-box { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; padding: 0 20px; box-sizing: border-box; }
        @media (max-width: 768px) { .admin-box { grid-template-columns: 1fr; } }
        
        .panel { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h2 { margin-top: 0; font-size: 1.4rem; color: #1e293b; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; font-weight: 600; color: #475569; }
        input, select, textarea { padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.95rem; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #6366f1; }
        textarea { font-family: monospace; resize: vertical; height: 250px; }
        
        .submit-btn { background: #6366f1; color: white; border: none; padding: 12px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .submit-btn:hover { background: #4f46e5; }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; }
        .delete-btn { background: #fee2e2; color: #ef4444; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
        .delete-btn:hover { background: #fca5a5; }
    </style>
</head>

        .uab-dropdown:focus-within .uab-dropdown-content {

        .uab-dropdown-content a {

    <div class="admin-box">
        <!-- Panel 1: Creation Engine Form -->
        <div class="panel">
            <h2><i data-lucide="plus-circle"></i> Add New Template</h2>
            <form id="letterForm" onsubmit="saveLetter(event)">
                <div class="form-group">
                    <label>Letter Title</label>
                    <input type="text" id="title" placeholder="e.g., Sick Leave Application" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category">
                        <option value="School & College">School & College</option>
                        <option value="Career & Jobs">Career & Jobs</option>
                        <option value="Financial & Help">Financial & Help</option>
                        <option value="Hostel & Campus">Hostel & Campus</option>
                        <option value="Official & Legal">Official & Legal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Search Keywords (Space/Comma separated)</label>
                    <input type="text" id="keywords" placeholder="e.g., medical, urgent, casual, principal, leave">
                </div>
                <div class="form-group">
                    <label>Letter Format Structure</label>
                    <textarea id="format" placeholder="To,&#10;The Principal..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Publish to Vault</button>
            </form>
        </div>

        <!-- Panel 2: Live Inventory Monitoring & Deletion Room -->
        <div class="panel">
            <h2><i data-lucide="database"></i> Current Database Items</h2>
            <div id="activeList">Loading Database inventory...</div>
        </div>
    </div>
