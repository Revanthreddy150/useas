<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kushi Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .video-container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .movie-title {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Autoplay requires mute=1 to comply with browser autoplay policies -->
        <iframe 
            src="https://www.youtube.com/embed/ydoWhuYY6WY?autoplay=1&mute=1&loop=1&playlist=ydoWhuYY6WY" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="movie-title">
        Movie Name : Kushi
    </div>

</body>
</html>
