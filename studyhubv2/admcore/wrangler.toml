# Cloudflare Worker Configuration for USEAS Admin Edge Gatekeeper
name = "useas-admin-gatekeeper"
main = "cloudflare-worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Environment Variables & Secrets
[vars]
# Replace with your actual GitHub Pages URL
ORIGIN_URL = "https://revanthreddy150.github.io"

# Secret key used for signing HttpOnly HMAC-SHA256 session tokens (override via `wrangler secret put JWT_SECRET` in production)
JWT_SECRET = "useas-admin-secure-edge-session-secret-2026-production-token"

# The 3 authorized admin Bcrypt password hashes
HASH_1 = "$2y$10$bHElaZPj7kxXbYE5TUYVMu4xZAxSJMXpLbh2b7nrQ62S1scfvMp8G"
